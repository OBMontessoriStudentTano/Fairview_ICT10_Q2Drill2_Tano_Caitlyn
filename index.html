<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Q Drill2</title>
     <link rel="stylesheet" 
    href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" 
    src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
     <style>

        /* Main Webpage */
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-image: url(https://i.pinimg.com/736x/68/46/bd/6846bdb097e410e13c9ffe794c928814.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 30px 0;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Add New Members Box */
        .add {
            width: 850px;
            max-width: 90%;
            min-height: 350px;
            margin: auto;
            background-color: rgba(225,228,196,0.75);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.20);
            box-sizing: border-box;
            backdrop-filter: blur(5px);
        }

        /* Main Heading */
        h1 {
            color: #25301f;
            margin-bottom: 5px;
            font-size: 32px;
            letter-spacing: 1px;
        }

        /* Subheading above the member list */
        h2 {
            color: #20301f;
            font-weight: normal;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 16px;
        }

        /* Input */
        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            background-color: bisque;
            border: 1px solid #7af092;
            border-bottom: 2px solid #aab896;
            border-radius: 0;
            font-size: 15px;
            color: #2a3025
        }

        /* Input border when selected */
        input:focus {
            outline: none;
            border: 2px solid #6aa332
        }

        /* Submit button */
        button {
            margin-top: 15px;
            padding: 12px 35px;
            background-color: #f59fcb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        /* Submit button changes color when hovered */
        button:hover {
            background-color: #a3325d;
        }

        /* Give the message */
        #message {
            margin-top: 25px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }

        /* Give the ordered list of members */
        #members {
            text-align: left;
            line-height: 1.8;
            color: #301f28
        }

        /* Displays the total number of members */
        #members p {
            text-align: center;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid rgba(37,48,31,0.25);
        }

    </style>
</head>
<body>

    <!--Main container-->
     <div class="add">
    
    <!--Main title-->
    <h1>Add New Communication Arts Club Members</h1>
    <br>

    <!--Input box for the first name-->
    <input type="text" id="text1" placeholder="Enter your first name">
    <br>

    <!--Input box for the last name-->
    <input type="text" id="text2" placeholder="Enter your last name">
    <br><br>

    <!--Submit Button-->
    <button type="button" py-click="enter">Submit</button>
    <br>
    
    <!--Error message-->
    <p id="message"></p>

    <!--List of Members-->
    <div id="box" style="display: none;">

        <!--Heading of the list of registered members-->
        <h2>List of Members</h2>
        
        <!--Total number of members-->
        <div id="members"></div>
    </div>

    </div>

    <!--Connect the webpage to the Python ordering program-->
    <script type="py" src="main.py"></script>
    
</body>
</html>
